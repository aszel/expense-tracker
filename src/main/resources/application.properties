spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expensetracker}
spring.datasource.username=${DB_USERNAME:expensetracker}
spring.datasource.password=${DB_PASSWORD:expensetracker}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# One trusted OpenID Connect realm. Keycloak must be ready before application startup.
spring.security.oauth2.client.registration.keycloak.client-id=expense-tracker-web
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/expense-tracker}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
